[package]
name = "workspaceai"
version = "0.0.1"
description = "WorkspaceAI desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "workspaceai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
