[package]
name = "harness"
version = "0.1.0"
description = "Harness desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
