[package]
name = "workspaceai-client"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
workspaceai-shared = { path = "../shared" }
chrono = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
