[package]
name = "workspaceai-supervisor"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
workspaceai-shared = { path = "../shared" }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
flate2 = "1"
getrandom = "0.2"
# Same backends @napi-rs/keyring uses, so entries the TS supervisor wrote are found (service "harness").
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tar = "0.4"
tiny_http = "0.12"
ureq = "2"
url = "2"

[[bin]]
# The MCP servers on their own (the app binary serves the same code as `workspaceai mcp <kind>`); tests drive it.
name = "workspaceai-mcp"
path = "src/bin/mcp.rs"

[dev-dependencies]
flate2 = "1"
tar = "0.4"
tempfile = "3"
