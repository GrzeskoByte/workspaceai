[package]
name = "workspaceai-app"
version = "0.0.1"
edition = "2024"
publish = false

[[bin]]
name = "workspaceai"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "654efae441bc8eb117d0042bb28cd7cf3570bdc9", features = ["wayland", "x11"] }
workspaceai-client = { path = "../client" }
workspaceai-shared = { path = "../shared" }
chrono = "0.4"
serde = "1"
serde_json = "1"
unicode-segmentation = "1"
wry = { version = "0.57", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[features]
default = ["webview"]
# The embedded web view (artifact pages, browser panel). Linux needs libwebkit2gtk-4.1-dev and libgtk-3-dev to
# build; `--no-default-features` builds without it and shows a notice where the page would be.
webview = ["dep:wry", "dep:raw-window-handle", "dep:gtk"]
